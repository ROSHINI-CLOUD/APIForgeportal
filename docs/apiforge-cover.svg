<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">APIForge Portal</title>
  <desc id="description">One query, multiple REST APIs. The sample shows the user and posts query and its two REST calls.</desc>
  <defs>
    <radialGradient id="glow" cx="20%" cy="0%" r="85%">
      <stop stop-color="#3c2114"/>
      <stop offset="1" stop-color="#0b0b0c"/>
    </radialGradient>
    <linearGradient id="panel" x2="0" y2="1">
      <stop stop-color="#211914"/>
      <stop offset="1" stop-color="#111111"/>
    </linearGradient>
  </defs>
  <path fill="#0b0b0c" d="M0 0h1280v640H0z"/>
  <path fill="url(#glow)" d="M0 0h1280v640H0z"/>
  <path stroke="#31251d" d="M72 555h1136"/>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <rect x="72" y="76" width="48" height="48" rx="14" fill="#392518" stroke="#64412b"/>
    <path d="m88 93-7 7 7 7m16-14 7 7-7 7m-6-18-4 22" fill="none" stroke="#f47935" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="137" y="109" font-size="25" font-weight="700" fill="#f6f2eb">APIForge <tspan fill="#f47935">Portal</tspan></text>
    <text x="68" y="243" font-size="69" font-weight="700" letter-spacing="-2" fill="#f6f2eb">One query.</text>
    <text x="68" y="320" font-size="63" font-weight="700" letter-spacing="-2" fill="#f47935">Multiple REST APIs.</text>
    <text x="72" y="386" font-size="24" fill="#c4b8ae">Turn sample REST responses into a schema.</text>
    <text x="72" y="422" font-size="24" fill="#c4b8ae">Query just the fields your app needs.</text>
    <text x="72" y="592" font-size="20" font-weight="600" fill="#f47935">apiforgeportal.vercel.app</text>
    <text x="1208" y="592" text-anchor="end" font-size="18" fill="#b4a79d">REST schema &amp; query playground</text>
    <rect x="720" y="113" width="488" height="384" rx="26" fill="url(#panel)" stroke="#543a2a"/>
    <text x="751" y="157" font-size="20" font-weight="700" fill="#f6f2eb">Playground</text>
    <text x="1177" y="157" text-anchor="end" font-size="15" fill="#b4a79d">Mock mode</text>
    <path stroke="#3b2f28" d="M750 174h428"/>
    <rect x="750" y="193" width="428" height="195" rx="12" fill="#0c0c0d"/>
    <g font-family="Menlo, Monaco, monospace" font-size="19" fill="#eee2d7">
      <text x="768" y="224">{</text>
      <text x="790" y="254"><tspan fill="#f47935">user</tspan>(id: 1) {</text>
      <text x="815" y="284">name</text>
      <text x="815" y="314"><tspan fill="#f47935">posts</tspan> { title }</text>
      <text x="790" y="344">}</text>
      <text x="768" y="374">}</text>
      <text x="750" y="428"><tspan fill="#8ed19d">GET</tspan> /users/1</text>
      <text x="750" y="465"><tspan fill="#8ed19d">GET</tspan> /posts?<tspan fill="#a5c6fb">userId</tspan>=<tspan fill="#e9bd87">1</tspan></text>
    </g>
  </g>
</svg>
