<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">APIForge unified query flow</title>
  <desc id="desc">A frontend query is parsed, planned, resolved through two REST calls, and returned as a trimmed response.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#14100d"/>
      <stop offset="1" stop-color="#201611"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#50301f"/>
      <stop offset="1" stop-color="#3e2619"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="8" flood-color="#f1b18d" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#f47935"/>
    </marker>
  </defs>

  <rect width="1200" height="430" rx="28" fill="url(#bg)"/>
  <text x="60" y="58" fill="#f1b18d" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="800" letter-spacing="2">FROM ONE QUERY TO A CLEAN RESPONSE</text>
  <text x="60" y="96" fill="#f6f2eb" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="800">From field selection to a trimmed response</text>

  <g filter="url(#shadow)">
    <rect x="60" y="145" width="245" height="210" rx="20" fill="#211a16" stroke="#594034"/>
    <rect x="84" y="171" width="94" height="26" rx="13" fill="#392518"/>
    <text x="103" y="189" fill="#f4a675" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="800">1 · ASK</text>
    <text x="84" y="228" fill="#f6f2eb" font-family="ui-monospace,Consolas,monospace" font-size="13">user(id: 1) {</text>
    <text x="102" y="252" fill="#d9c8bb" font-family="ui-monospace,Consolas,monospace" font-size="13">name</text>
    <text x="102" y="276" fill="#d9c8bb" font-family="ui-monospace,Consolas,monospace" font-size="13">address { city }</text>
    <text x="102" y="300" fill="#d9c8bb" font-family="ui-monospace,Consolas,monospace" font-size="13">posts { title }</text>
    <text x="84" y="324" fill="#f6f2eb" font-family="ui-monospace,Consolas,monospace" font-size="13">}</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="355" y="145" width="245" height="210" rx="20" fill="url(#accent)"/>
    <rect x="379" y="171" width="120" height="26" rx="13" fill="#f8f3ed" opacity=".18"/>
    <text x="397" y="189" fill="#f8f3ed" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="800">2 · PLAN</text>
    <text x="379" y="228" fill="#f8f3ed" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="800">Understand the query</text>
    <text x="379" y="264" fill="#eee2d7" font-family="Inter,Arial,sans-serif" font-size="13">• Check fields and syntax</text>
    <text x="379" y="290" fill="#eee2d7" font-family="Inter,Arial,sans-serif" font-size="13">• Follow User → Posts</text>
    <text x="379" y="316" fill="#eee2d7" font-family="Inter,Arial,sans-serif" font-size="13">• Select only requested data</text>
    <text x="379" y="341" fill="#f1b18d" font-family="Inter,Arial,sans-serif" font-size="12">Max 10 REST calls</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="650" y="145" width="245" height="210" rx="20" fill="#211a16" stroke="#594034"/>
    <rect x="674" y="171" width="115" height="26" rx="13" fill="#24392b"/>
    <text x="692" y="189" fill="#a1d9ad" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="800">3 · RESOLVE</text>
    <text x="674" y="228" fill="#f6f2eb" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800">Call the right APIs</text>
    <rect x="674" y="249" width="195" height="30" rx="8" fill="#10100f"/>
    <text x="687" y="269" fill="#eee2d7" font-family="ui-monospace,Consolas,monospace" font-size="12">GET /users/1</text>
    <rect x="674" y="288" width="195" height="30" rx="8" fill="#10100f"/>
    <text x="687" y="308" fill="#eee2d7" font-family="ui-monospace,Consolas,monospace" font-size="12">GET /posts?userId=1</text>
    <text x="674" y="341" fill="#bfafa3" font-family="Inter,Arial,sans-serif" font-size="12">Mock or Live mode</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="945" y="145" width="195" height="210" rx="20" fill="#151310" stroke="#51382b"/>
    <rect x="969" y="171" width="100" height="26" rx="13" fill="#24392b"/>
    <text x="987" y="189" fill="#a1d9ad" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="800">4 · RETURN</text>
    <text x="969" y="228" fill="#f8f3ed" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800">Trimmed result</text>
    <text x="969" y="260" fill="#a1d9ad" font-family="ui-monospace,Consolas,monospace" font-size="12">name: Leanne Graham</text>
    <text x="969" y="284" fill="#a1d9ad" font-family="ui-monospace,Consolas,monospace" font-size="12">city: Gwenborough</text>
    <text x="969" y="308" fill="#a1d9ad" font-family="ui-monospace,Consolas,monospace" font-size="12">posts: [{ title… }]</text>
    <text x="969" y="341" fill="#bfafa3" font-family="Inter,Arial,sans-serif" font-size="12">Calls and errors shown</text>
  </g>

  <path d="M305 250 H348" fill="none" stroke="#f47935" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M600 250 H643" fill="none" stroke="#f47935" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M895 250 H938" fill="none" stroke="#f47935" stroke-width="3" marker-end="url(#arrow)"/>
</svg>
