<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">APIForge Portal architecture</title>
  <desc id="desc">API team and frontend developer connect through APIForge Portal, which transforms REST samples into a schema and resolves queries into REST calls.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#14100d"/>
      <stop offset="1" stop-color="#211713"/>
    </linearGradient>
    <linearGradient id="portal" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#50301f"/>
      <stop offset="1" stop-color="#251913"/>
    </linearGradient>
    <linearGradient id="card" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#211a16"/>
      <stop offset="1" stop-color="#121211"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#080808" flood-opacity=".45"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#f47935"/>
    </marker>
  </defs>

  <rect width="1200" height="520" rx="30" fill="url(#bg)"/>

  <text x="70" y="62" fill="#f1b18d" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2">APIFORGE PORTAL · HIGH-LEVEL ARCHITECTURE</text>
  <text x="70" y="103" fill="#f8f3ed" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="800">How APIForge connects API teams and frontend developers</text>

  <g filter="url(#shadow)">
    <rect x="70" y="160" width="245" height="270" rx="22" fill="url(#card)" stroke="#51382b"/>
    <circle cx="122" cy="212" r="25" fill="#3b281d"/>
    <path d="M112 211h20M116 203v17M124 203v17" stroke="#f4a675" stroke-width="3" stroke-linecap="round"/>
    <text x="165" y="207" fill="#f8f3ed" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="800">API team</text>
    <text x="165" y="230" fill="#c0afa2" font-family="Inter,Arial,sans-serif" font-size="13">Defines the data</text>
    <g font-family="Inter,Arial,sans-serif" font-size="14" fill="#eee2d7">
      <text x="102" y="286">• Adds REST sources</text>
      <text x="102" y="320">• Supplies sample JSON</text>
      <text x="102" y="354">• Reviews generated schema</text>
      <text x="102" y="388">• Publishes versions</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="417" y="145" width="366" height="300" rx="26" fill="url(#portal)"/>
    <rect x="442" y="170" width="316" height="54" rx="14" fill="#f8f3ed" opacity=".12"/>
    <circle cx="477" cy="197" r="16" fill="#f8f3ed" opacity=".92"/>
    <path d="M469 197h16M477 189v16" stroke="#f47935" stroke-width="3" stroke-linecap="round"/>
    <text x="507" y="204" fill="#f8f3ed" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="800">APIForge Portal</text>
    <g font-family="Inter,Arial,sans-serif">
      <text x="468" y="267" fill="#eee2d7" font-size="15" font-weight="700">1 · Transform samples into a schema</text>
      <text x="468" y="306" fill="#eee2d7" font-size="15" font-weight="700">2 · Explore and validate queries</text>
      <text x="468" y="345" fill="#eee2d7" font-size="15" font-weight="700">3 · Resolve queries into REST calls</text>
      <text x="468" y="384" fill="#f1b18d" font-size="14">Browser-only · Mock or Live mode</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="885" y="160" width="245" height="270" rx="22" fill="url(#card)" stroke="#51382b"/>
    <circle cx="937" cy="212" r="25" fill="#3b281d"/>
    <path d="M926 215c6-12 16-12 22 0M930 224h14M937 198v7" fill="none" stroke="#f4a675" stroke-width="3" stroke-linecap="round"/>
    <text x="980" y="207" fill="#f8f3ed" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="800">Frontend dev</text>
    <text x="980" y="230" fill="#c0afa2" font-family="Inter,Arial,sans-serif" font-size="13">Uses the data</text>
    <g font-family="Inter,Arial,sans-serif" font-size="14" fill="#eee2d7">
      <text x="917" y="286">• Searches published fields</text>
      <text x="917" y="320">• Runs one unified query</text>
      <text x="917" y="354">• Sees calls and errors</text>
      <text x="917" y="388">• Saves reusable queries</text>
    </g>
  </g>

  <path d="M315 295 C355 295 372 295 417 295" fill="none" stroke="#f47935" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M783 295 C826 295 845 295 885 295" fill="none" stroke="#f47935" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="340" y="278" fill="#f1b18d" font-family="Inter,Arial,sans-serif" font-size="13">samples + rules</text>
  <text x="805" y="278" fill="#f1b18d" font-family="Inter,Arial,sans-serif" font-size="13">schema + results</text>

  <text x="70" y="486" fill="#b8aa9e" font-family="Inter,Arial,sans-serif" font-size="12">REST sources remain separate behind the portal; the developer gets one clear, trimmed response.</text>
</svg>
